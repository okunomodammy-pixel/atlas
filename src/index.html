function keyLines() {
  const lat = (v, cls, name) => ({cls, name, geo: {type: "LineString", coordinates: d3.range(-180, 181, 2).map(x => [x, v])}});
  const lon = (v, cls, name) => ({cls, name, geo: {type: "LineString", coordinates: d3.range(-90, 91, 2).map(y => [v, y])}});

  return [lat(0, "eq", "Equator 0°"), lat(23.436, "tr", "Tropic of Cancer ≈23.44° N"), lat(-23.436, "tr", "Tropic of Capricorn ≈23.44° S"),
    lat(66.564, "po", "Arctic Circle ≈66.56° N"), lat(-66.564, "po", "Antarctic Circle ≈66.56° S"), lon(0, "pm", "Prime Meridian 0°")]; }

function buildMap() {
  const topo = D.world;

    let key = f.id;

    if (featByKey.has(key)) key = "x:" + nm; // e.g. Ashmore and Cartier Is. shares Australia's code
    f.key = key; featByKey.set(key, f);

  G.countries.selectAll("path").data(feats, d => d.key).join("path").attr("class", "country")
    .attr("data-k", d => d.key).on("click", (ev, d) => { ev.stopPropagation(); if (S.tool && S.tool.onMap) { const c = invertPointer(ev); if (c) S.tool.onMap(c); return; } onCountryClick(d.key); })
    .append("title").text(d => nameOf(d.key));
  // countries too small to click at 1:50m, or missing from it, get a tappable ring
  const tiny = Object.entries(D.facts).filter(([k, f]) => (f.a < 2500 || !featByKey.has(k)) && f.ll && f.ll.length === 2 && (f.ind || f.un || f.obs))
    .map(([k, f]) => ({k, c: featByKey.has(k) ? centroid.get(k) : [f.ll[1], f.ll[0]]}));
  tiny.forEach(t => { if (!centroid.has(t.k)) centroid.set(t.k, t.c); });
  G.tiny.selectAll("circle").data(tiny).join("circle").attr("class", "tiny").attr("data-k", d => d.k)
    .on("click", (ev, d) => { ev.stopPropagation(); onCountryClick(d.k); }).append("title").text(d => nameOf(d.k));

    return {k: f.key, c: labelPoint(f), t: fa ? fa.n : f.properties.name, minz}; });

  G.rivers.selectAll("path").data(rv).join("path").attr("class", d => "river" + (d.properties.scalerank <= 2 ? " major" : ""))
    .append("title").text(d => d.properties.name || "River");
  const lk = topojson.feature(D.phys.lakes, Object.values(D.phys.lakes.objects)[0]).features;
  G.lakes.selectAll("path").data(lk).join("path").attr("class", "lake");
  G.lines.selectAll("path").data(keyLines()).join("path").attr("class", d => "keyline " + d.cls).append("title").text(d => d.name);
  // seas: oceans always; seas, gulfs, bays and straits as you zoom
  const seas = D.phys.marine.filter(m => ["ocean","sea","gulf","bay","strait","channel"].includes(m.c))
    .map(m => ({...m, minz: m.c === "ocean" ? (m.s <= 0 ? 0 : .9) : m.s <= 2 ? 1.6 : m.s <= 3 ? 3 : 6, t: titleCase(m.n)}));
  G.seas.selectAll("text").data(seas).join("text").text(d => d.t).style("font-size", d => d.c === "ocean" ? "1.1em" : null).style("letter-spacing", d => d.c === "ocean" ? ".25em" : null);
  const phys = D.phys.labels.filter(l => ["Range/mtn","Desert","Plateau","Basin","Plain","Delta","Valley","Pen/cape","Peninsula","Wetlands","Isthmus"].includes(l.c))
    .map(l => ({...l, t: titleCase(l.n), minz: l.s <= 1 ? 0 : l.s <= 2 ? 1.6 : l.s <= 3 ? 3 : 6}));
  G.phys.selectAll("text").data(phys).join("text").text(d => d.t);
  const cities = D.cities.map(c => ({...c, minz: c.s <= 1 ? 0 : c.cap ? (c.p > 1e6 ? 1.6 : 3) : c.s <= 3 ? 3 : 6}));
  const cg = G.cities.selectAll("g").data(cities).join("g");
  cg.append("circle").attr("class", d => "dot" + (d.cap ? " cap" : ""));
  cg.append("text").attr("x", 4).attr("y", -3).text(d => d.n);
  buildTZ(); buildBathy(); applyLayers(); }

function labelPoint(f) {
  // label at the centroid of the largest polygon, so France sits in Europe, not the Atlantic
  if (f.geometry.type !== "MultiPolygon") return d3.geoCentroid(f);
  let best = null, ba = -1;
  f.geometry.coordinates.forEach(c => { const g = {type: "Polygon", coordinates: c}, a = d3.geoArea(g); if (a > ba && a < 2 * Math.PI) { ba = a; best = g; } });
  return d3.geoCentroid(best); }
const titleCase = s => s === s.toUpperCase() ? s.toLowerCase().replace(/(^|[\s\-(])([a-zà-ÿ’'])/g, (m, a, b) => a + b.toUpperCase()).replace(/\bMts\b/, "Mts").replace(/\bOf\b/g, "of") : s;

function applyLayers() {

  if (G.tz) { G.tz.attr("display", S.layers.tz ? null : "none"); G.tzlabels.attr("display", S.layers.tz ? null : "none"); }
  if (G.bathy) G.bathy.attr("display", S.layers.depth ? null : "none");

/* ---------- navigation ---------- */
function flyTo(feature, opts = {}) {
  const dur = opts.duration ?? 900, pad = opts.pad ?? 0.82, maxk = opts.maxk ?? 24;
  if (S.proj === "globe") {
    const c = d3.geoCentroid(feature), r0 = projection.rotate(), r1 = [-c[0], -c[1], 0];
    const b = d3.geoBounds(feature); let span = Math.max(Math.abs(b[1][0] - b[0][0]) % 360, Math.abs(b[1][1] - b[0][1]));
    if (!isFinite(span) || span > 180) span = 60;
    const k1 = Math.max(1, Math.min(maxk, 90 / Math.max(span, 1.5) * pad)), k0 = S.k;
    d3.transition().duration(dur).tween("rot", () => { const ir = d3.interpolate(r0, r1), ik = d3.interpolate(k0, k1);
      return t => { projection.rotate(ir(t)); S.k = ik(t); projection.scale(baseScale * S.k); render(); }; })
      .on("end", () => { S.rot = projection.rotate(); svg.call(zoom.transform, d3.zoomIdentity.scale(S.k)); S.t = d3.zoomIdentity.scale(S.k); });
    return; }
  let [[x0, y0], [x1, y1]] = path.bounds(feature);
  if (x1 - x0 > W * 0.7) { const c = projection(d3.geoCentroid(feature)); x0 = c[0] - 60; x1 = c[0] + 60; y0 = c[1] - 40; y1 = c[1] + 40; }
  const k = Math.max(1, Math.min(maxk, pad / Math.max((x1 - x0) / W, (y1 - y0) / H)));
  const tx = W / 2 - k * (x0 + x1) / 2, ty = H / 2 - k * (y0 + y1) / 2;
  svg.transition().duration(dur).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(k)); }
function flyToPoint(c, k = 6) {
  if (S.proj === "globe") return flyTo({type: "Point", coordinates: c}, {maxk: k});
  const p = projection(c); svg.transition().duration(800).call(zoom.transform, d3.zoomIdentity.translate(W / 2 - k * p[0], H / 2 - k * p[1]).scale(k)); }
function flyToKeys(keys, opts) { const fs = keys.map(k => featByKey.get(k)).filter(Boolean); if (fs.length) flyTo({type: "FeatureCollection", features: fs}, opts); }
function resetView() { if (S.proj === "globe") { S.k = 1; projection.scale(baseScale); svg.call(zoom.transform, d3.zoomIdentity); render(); } else svg.transition().duration(700).call(zoom.transform, d3.zoomIdentity); }

  <h3>1. A globe and a flat map</h3>
  <p>A globe keeps shapes, sizes and distances true, but you only see half of it at once. A flat map shows everything at once, and pays for it with distortion.</p>
  <div class="btnrow"><button class="btn primary" data-act="globe">Show the globe</button><button class="btn" data-act="flat">Back to a flat map</button></div>
  <p class="src">On the globe, drag to turn the Earth and pinch or scroll to zoom.</p>

  <h3>2. Projections and the Greenland problem</h3>
  <p>A projection is the rule for turning the curved Earth into a flat picture. Mercator, the projection behind most web maps, keeps local shapes and compass directions correct, which made it ideal for sailors. To do that it stretches everything away from the Equator. At 60° north it stretches distances 2 times and areas 4 times; at Greenland's latitudes the stretch is larger still.</p>
  <dl class="facts"><dt>Greenland</dt><dd>${fmt(gl.a)} km²</dd><dt>Africa</dt><dd>${fmt(afr)} km² <span class="src">(sum of every African country and territory in the dataset)</span></dd><dt>Ratio</dt><dd>Africa is about <b>${Math.round(afr / gl.a)} times</b> larger</dd></dl>

  <p>On Mercator they look similar in size. On Equal Earth, which keeps areas true, Africa's real size shows. This is why Africa is so often underestimated on everyday maps.</p>

  <h3>3. Latitude, longitude and the key lines</h3>

  <ul><li><b style="color:#C2412D">Equator, 0°</b>: splits the Northern and Southern Hemispheres.</li>
  <li><b style="color:#C2412D">Prime Meridian, 0°</b>: runs through Greenwich in London; splits the Eastern and Western Hemispheres.</li>

  <li><b style="color:#4F94B8">Arctic and Antarctic Circles, about 66.56°</b>: beyond them there is at least one day a year with no sunset and one with no sunrise.</li></ul>

  <p>Lagos sits at about ${latStr(LAGOS[1])}, ${lonStr(LAGOS[0])}: just north of the Equator and just east of the Prime Meridian, so it is in the Northern and Eastern Hemispheres. Tap a row to draw the route.</p>

  <p>Notice the line to Beijing or New York. It bends on a flat map, because the shortest path on a sphere follows a <b>great circle</b>. That is why flights from Lagos to New York cross the Atlantic in a curve that looks longer on paper.</p>

function highlight(c3s, opts = {}) {

/* ---------- Borders course ---------- */
const CASES = [
 { t: "The partition of Africa", keys: ["DZA","LBY","EGY","SDN","MLI","NER","MRT","TCD"], maxk: 4,

   <p>The map highlights the Sahara, where many borders are <b>straight lines</b>: lines of latitude, longitude or survey lines through sparsely populated desert. Elsewhere, borders cut through peoples: Yoruba communities live in Nigeria and Benin, Hausa in Nigeria and Niger, Ewe in Ghana and Togo, Somali in Somalia, Ethiopia, Kenya and Djibouti.</p>
   <p>In 1964 the Organisation of African Unity agreed that member states would respect the borders they inherited at independence. Most borders have stayed put since, even where they divide communities.</p>` },
 { t: "The Gambia: a river becomes a country", keys: ["GMB","SEN"], maxk: 14,
   body: `<p>Britain held trading posts along the Gambia River; France held the land around it. In 1889 the two agreed a border that follows the river valley. The result is a country roughly 10–50 km wide and about 300 km long, almost cutting Senegal in two.</p>
   <p>Lesson: a "natural" border such as a river is still a political choice. Here it was chosen for trade, not for the people living on its banks.</p>` },
 { t: "Togoland and the Cameroons: borders by vote", keys: ["TGO","GHA","CMR","NGA"], maxk: 6,
   body: `<p>Germany lost its colonies after the First World War. <b>Togoland</b> was split between Britain and France; in a 1956 plebiscite British Togoland voted to join the Gold Coast, which became Ghana. <b>Kamerun</b> was split too: in 1961 the northern part of British Cameroons voted to join Nigeria and the southern part to join Cameroon.</p>
   <p>The Nigeria–Cameroon border was later tested again over the oil-rich <b>Bakassi Peninsula</b>. The International Court of Justice ruled in 2002 that it belongs to Cameroon, and Nigeria completed the handover in 2008.</p>` },
 { t: "The Middle East after the Ottoman Empire", keys: ["IRQ","SYR","LBN","JOR","ISR","PSE","SAU"], maxk: 6,
   body: `<p>During the First World War, Britain and France secretly agreed the Sykes–Picot plan (1916) to divide Ottoman lands into zones of influence. After the war the League of Nations gave Britain mandates over Iraq, Palestine and Transjordan, and France mandates over Syria and Lebanon.</p>
   <p>Straight desert lines between Jordan, Iraq, Syria and Saudi Arabia date from this period. But the final borders also came from later treaties, local rulers, independence struggles and wars, including the Arab–Israeli wars, so no single agreement explains the whole map.</p>` },

   body: `<p>When British rule ended in 1947, British India was split into two states: India and Pakistan, which had two parts more than 1,500 km apart. The new boundary, drawn under Cyril Radcliffe in a few weeks, split Punjab and Bengal. Millions of people were displaced and many were killed in the violence that followed.</p>
   <p>East Pakistan became independent <b>Bangladesh</b> in 1971. Kashmir has been disputed between India and Pakistan since 1947, with China also controlling part of the wider region.</p>` },

   body: `<p>In 1945 the United States and the Soviet Union divided Korea at the <b>38th parallel</b> (38° N) to accept Japan's surrender. Two states formed in 1948. The Korean War (1950–1953) ended in an armistice, not a peace treaty; the Demilitarised Zone runs close to the old line.</p>
   <p>Turn on "Equator, tropics &amp; grid" in Layers and zoom in: the border wanders around the 38th parallel rather than following it exactly.</p>` },
 { t: "The breakup of Yugoslavia (1991–2008)", keys: ["SVN","HRV","BIH","SRB","MNE","MKD","UNK"], maxk: 10,
   body: `<p>Yugoslavia was a federation of six republics. Slovenia, Croatia and North Macedonia declared independence in 1991 and Bosnia and Herzegovina in 1992, followed by wars, especially in Croatia and Bosnia. Serbia and Montenegro stayed together until Montenegro became independent in 2006. Kosovo declared independence from Serbia in 2008, which Serbia does not recognise.</p>
   <p>Most of the new international borders were the old internal republic boundaries, a pattern also seen in the Soviet Union.</p>` },
 { t: "After the Soviet Union (1991)", keys: ["RUS","UKR","BLR","MDA","EST","LVA","LTU","GEO","ARM","AZE","KAZ","UZB","TKM","KGZ","TJK"], maxk: 3,
   body: `<p>When the Soviet Union dissolved in 1991, its 15 republics became independent states along their internal boundaries. Lines drawn for administration became international borders overnight, leaving Russian-speaking minorities outside Russia and ethnic enclaves across Central Asia and the Caucasus.</p>
   <p>Several remain contested. Russia annexed Crimea from Ukraine in 2014, which most countries do not recognise, and launched a full-scale invasion of Ukraine in 2022. Azerbaijan retook Nagorno-Karabakh, whose ethnic Armenian population then left, in 2023.</p>` },

function rotateFeature(f, from, to) {

const gamePool = (scope, minA = 0) => [...featByKey.keys()].filter(k => { const f = byKey.get(k); return f && (f.un || f.obs) && f.a >= minA && (scope !== "Africa" || f.reg === "Africa"); });
function pickDistractors(k, n, pool, same) { const f = byKey.get(k);
  const close = shuffle(pool.filter(x => x !== k && same(byKey.get(x), f))), rest = shuffle(pool.filter(x => x !== k && !close.includes(x)));
  return [...close, ...rest].slice(0, n); }
function shapeSVG(k) { const f = featByKey.get(k), c = labelPoint(f);
  const p = d3.geoOrthographic().rotate([-c[0], -c[1]]).fitExtent([[10, 10], [210, 150]], f);
  return `<svg class="shape" viewBox="0 0 220 160" role="img" aria-label="Country outline"><path d="${d3.geoPath(p)(f)}"/></svg>`; }
const GAMES = {
  capitals: { name: "Capitals", desc: "Match countries and capitals.", gen(scope) {
    const pool = gamePool(scope).filter(k => byKey.get(k).cap && byKey.get(k).cap.length), k = shuffle(pool)[0], f = byKey.get(k);
    const ds = pickDistractors(k, 3, pool, (a, b) => a.sub === b.sub);
    if (Math.random() < .5) { const opts = shuffle([k, ...ds]);
      return {q: `What is the capital of <b>${esc(f.n)}</b>?`, opts: opts.map(x => byKey.get(x).cap[0]), a: opts.indexOf(k), why: `${f.cap[0]} is the capital of ${f.n}.`, show: k,
        wrong: opts.map(x => `You chose ${byKey.get(x).cap[0]}, the capital of ${nameOf(x)}`)}; }
    const opts = shuffle([k, ...ds]);
    return {q: `<b>${esc(f.cap[0])}</b> is the capital of…`, opts: opts.map(nameOf), a: opts.indexOf(k), why: `${f.cap[0]} is the capital of ${f.n}.`, show: k,
      wrong: opts.map(x => `${nameOf(x)}'s capital is ${(byKey.get(x).cap || ["not listed"])[0]}`)}; } },
  flags: { name: "Flags", desc: "Name the country from its flag.", gen(scope) {
    const pool = gamePool(scope).filter(k => byKey.get(k).flag), k = shuffle(pool)[0], f = byKey.get(k), opts = shuffle([k, ...pickDistractors(k, 3, pool, (a, b) => a.sub === b.sub)]);
    return {q: `Whose flag is this?<div class="bigflag">${f.flag}</div>`, opts: opts.map(nameOf), a: opts.indexOf(k), why: `That is the flag of ${f.n}.`, show: k,
      wrong: opts.map(x => `${nameOf(x)}'s flag is ${byKey.get(x).flag}`)}; } },
  shapes: { name: "Shapes", desc: "Recognise a country from its outline alone.", gen(scope) {
    const pool = gamePool(scope, 20000).filter(k => !["RUS","USA","FJI","KIR","CAN","NZL"].includes(byKey.get(k).c3)), k = shuffle(pool)[0], opts = shuffle([k, ...pickDistractors(k, 3, pool, (a, b) => a.sub === b.sub)]);
    return {q: `Which country has this shape?${shapeSVG(k)}`, opts: opts.map(nameOf), a: opts.indexOf(k), why: `That is ${nameOf(k)}, in ${byKey.get(k).sub}.`, show: k}; } },
  bigger: { name: "Bigger or smaller", desc: "Which has more land? Beware of Mercator.", gen(scope) {
    const pool = gamePool(scope, 30000); let a, b, r;
    do { [a, b] = shuffle(pool); r = byKey.get(a).a / byKey.get(b).a; } while (r < 1 / 3 || r > 3 || Math.abs(r - 1) < .08);
    const fa = byKey.get(a), fb = byKey.get(b), big = fa.a > fb.a ? 0 : 1;
    return {q: `Which country is larger by area?`, opts: [fa.n, fb.n], a: big, why: `${fa.n}: ${fmt(fa.a)} km². ${fb.n}: ${fmt(fb.a)} km². The larger is about ${(Math.max(r, 1 / r)).toFixed(1)} times the size of the other.`, show: big ? b : a}; } },
  north: { name: "Further north", desc: "Compare capitals by latitude.", gen(scope) {
    const caps = D.cities.filter(c => c.cap && byC3.has(c.c3) && (scope !== "Africa" || byKey.get(byC3.get(c.c3)).reg === "Africa"));
    let a, b; do { [a, b] = shuffle(caps); } while (Math.abs(a.y - b.y) < 1.5 || Math.abs(a.y - b.y) > 25);

};
function mcGame(id, scope) {
  const g = GAMES[id], N = 10; let i = 0, score = 0, streak = 0, best = 0;
  if (scope === "Africa") flyToKeys(Object.keys(D.facts).filter(k => D.facts[k].reg === "Africa" && D.facts[k].un), {pad: .95, maxk: 4}); else resetView();
  const ask = () => { const r = g.gen(scope); S.sel = null; paint(); setPins([]);
    setPanel(`<div class="eyebrow">${esc(g.name)}, ${scope === "Africa" ? "Africa" : "the world"}</div><div class="progress"><i style="width:${i / N * 100}%"></i></div>
      <div class="q">${r.q}</div><div class="opts">${r.opts.map((o, j) => `<button data-j="${j}">${esc(o)}</button>`).join("")}</div><div id="why"></div>
      <p class="src">Score ${score} / ${i}${streak > 1 ? ` · streak ${streak}` : ""}</p>`);
    panel.querySelectorAll(".opts button").forEach(b => b.onclick = () => { if (panel.querySelector(".opts .right")) return;
      const ok = +b.dataset.j === r.a; if (ok) { score++; streak++; best = Math.max(best, streak); } else streak = 0;
      b.classList.add(ok ? "right" : "wrong"); panel.querySelector(`.opts [data-j="${r.a}"]`).classList.add("right");
      if (r.show) { S.sel = r.show; paint(); flyTo(featByKey.get(r.show), {pad: .5, maxk: 8}); }
      if (r.pins) { setPins(r.pins.map(c => ({c}))); flyTo({type: "MultiPoint", coordinates: r.pins}, {pad: .6, maxk: 6}); }
      $("#why").innerHTML = `<p>${ok ? "<b>Right.</b>" : "<b>Not quite.</b>"} ${!ok && r.wrong && r.wrong[+b.dataset.j] ? esc(r.wrong[+b.dataset.j]) + ". " : ""}${esc(r.why)}</p><button class="btn primary" id="next">${i + 1 < N ? "Next" : "See score"}</button>`;
      $("#next").onclick = () => { i++; if (i < N) ask(); else done(); }; }); };
  const done = () => { const key = id + ":" + scope; saved.best[key] = Math.max(saved.best[key] || 0, score); store.set(saved); S.sel = null; paint(); setPins([]);
    setPanel(`<div class="eyebrow">${esc(g.name)}: your score</div><p class="score">${score} / ${N}</p><p>Longest streak: ${best}. Best ever: ${saved.best[key]} / ${N}.</p>
      <div class="btnrow"><button class="btn primary" data-act="game" data-g="${id}" data-scope="${scope}">Play again</button><button class="btn" data-mode-go="quiz">All games</button></div>`); };
  ask(); }
ACT.game = el => mcGame(el.dataset.g, el.dataset.scope);

/* Nigeria states: tap the state on the map */

  const st = topojson.feature(D.ng.states, Object.values(D.ng.states.objects)[0]).features;
  const nbSet = new Set(byKey.get("566").b.map(c => byC3.get(c)));
  G.countries.selectAll("path").classed("dim", d => d.key !== "566" && !nbSet.has(d.key));
  G.states.selectAll("path").data(st).join("path").attr("class", "state").style("fill", "var(--land)")
    .on("click", (ev, d) => { ev.stopPropagation(); if (S.quiz && S.quiz.onState) S.quiz.onState(d.properties.name); });
  render(); flyTo(featByKey.get("566"), {pad: .9, maxk: 14}); svg.classed("picking", true); $("#L-labels").checked = false; applyLayers();
  const qs = shuffle(st.map(f => f.properties.name)).slice(0, 10); let i = 0, score = 0, locked = false;
  const ask = () => { locked = false; G.states.selectAll("path").style("fill", "var(--land)"); banner(`Tap: ${stName(qs[i])}`);
    setPanel(`<div class="eyebrow">Nigeria's states</div><div class="progress"><i style="width:${i * 10}%"></i></div><p class="q">Where is <b>${esc(stName(qs[i]))}</b>?</p><p>Tap the state on the map. Names are hidden.</p><p class="score">${score} / ${i}</p><p><button class="btn" data-act="qstop">Stop</button></p>`); };
  S.quiz = { onClick() {}, onSea() {},
    onState(s) { if (locked) return; locked = true; const ok = s === qs[i]; if (ok) score++;
      G.states.selectAll("path").style("fill", d => d.properties.name === qs[i] ? "var(--hit)" : (!ok && d.properties.name === s) ? "var(--miss)" : "var(--land)");
      banner(ok ? `Correct: ${stName(qs[i])} (${zoneOf(qs[i])})` : `That was ${stName(s)}. ${stName(qs[i])} is in green, in the ${zoneOf(qs[i])}.`);
      i++; setTimeout(() => { if (i < 10) ask(); else { S.quiz.stop(); S.quiz = null; saved.best.states = Math.max(saved.best.states || 0, score); store.set(saved);
        setPanel(`<div class="eyebrow">Result</div><p class="score">${score} / 10</p><div class="btnrow"><button class="btn primary" data-act="qstates">Play again</button><button class="btn" data-mode-go="nigeria">Study the zones</button><button class="btn" data-mode-go="quiz">All games</button></div>`); } }, ok ? 900 : 2200); },
    stop() { svg.classed("picking", false); banner(null); $("#L-labels").checked = true; applyLayers(); G.states.selectAll("*").remove(); } };

   <p>As the ice melted, the sea rose and drowned these plains; most of the rise was over by about 7,000 years ago. The map is now showing ocean depths: the palest sea next to the coasts is the continental shelf, under 200 metres deep. Much of the shallowest part of it was dry land then.</p>
   <p><b>Why it matters:</b> it explains how people walked to the Americas and nearly walked to Australia, and why Britain, Japan and Sri Lanka became islands only recently in human terms.</p>`,
   pins: [pin("Beringia", [-170, 65]), pin("Sundaland", [108, 2]), pin("Sahul", [137, -10]), pin("Doggerland", [3, 54.5])], depth: true, fly: "world" },
 { t: "The first farmers", when: "from about 11,500 years ago",
   body: `<p>Farming was not invented once and spread; it was invented several times, independently, wherever useful wild plants and animals lived. The main centres:</p>
   <ul><li><b>Fertile Crescent</b> (Iraq, Syria, Türkiye, Iran): wheat, barley, lentils, sheep and goats, from about 11,500 years ago.</li>
   <li><b>China</b>: rice along the Yangtze and millet along the Yellow River, by about 9,000 years ago.</li>
   <li><b>New Guinea highlands</b>: taro and bananas, several thousand years ago.</li>
   <li><b>Mesoamerica</b> (Mexico): maize, beans and squash; maize was bred from a wild grass, teosinte.</li>
   <li><b>The Andes</b>: potatoes, quinoa, llamas and alpacas.</li>
   <li><b>West Africa</b>: pearl millet, sorghum, African rice, yams, cowpeas and the oil palm: much of what Nigerians still eat began here.</li>
   <li><b>Ethiopian highlands</b>: teff, coffee and enset.</li></ul>
   <p>Farming fed more people per square kilometre than hunting and gathering, so farming populations grew and spread, often absorbing or displacing their neighbours.</p>`,
   pins: [pin("Fertile Crescent", [40, 35]), pin("Yangtze & Yellow River", [113, 32]), pin("New Guinea", [144, -6]), pin("Mesoamerica", [-97, 18]), pin("Andes", [-72, -14]), pin("West Africa", [2, 12]), pin("Ethiopian highlands", [38.5, 9])], fly: "world" },
 { t: "Cities of the river valleys", when: "about 3500 to 1500 BC",
   body: `<p>The first cities and states grew in four river valleys: the <b>Tigris and Euphrates</b> (Mesopotamia, now Iraq), the <b>Nile</b> (Egypt), the <b>Indus</b> (Pakistan and north-west India) and the <b>Yellow River</b> (China). Writing appeared in Mesopotamia by about 3200 BC and in Egypt at about the same time; Egypt was united around 3100 BC; the Indus cities of Harappa and Mohenjo-daro flourished about 2600–1900 BC; the Shang state rose on the Yellow River around 1600 BC.</p>
   <p><span class="kind">Interpretation</span>Rivers gave water in dry lands, rich silt from floods, and a highway for trade. Controlling floods and sharing water needed organisation, records and rulers. Blainey stresses the river as highway; others stress the surplus of grain that could feed priests, soldiers and scribes.</p>
   <p><b>Counterpoint:</b> rivers were not the only route to civilisation. Caral in Peru built pyramids around 2600 BC in a narrow coastal valley, and the Maya built cities in tropical forest.</p>`,

   keys: ["IRQ", "EGY", "PAK", "CHN"], fly: "pins" },
 { t: "The Mediterranean world", when: "about 1000 BC to AD 400",
   body: `<p>The Mediterranean is an almost closed sea with calm summers, so it became a highway long before the open oceans were. Phoenician traders from Tyre and Sidon (now Lebanon) founded Carthage in today's Tunisia; Greek city-states such as Athens planted colonies from Spain to the Black Sea; Alexander's city of Alexandria, founded in 331 BC, became the greatest centre of learning of its age.</p>
   <p>Rome destroyed Carthage in 146 BC and by 30 BC ruled every shore of the sea, which Romans called <i>mare nostrum</i>, "our sea". The highlighted countries were wholly or partly inside the empire at its greatest extent, around AD 117.</p>`,

   keys: ["PRT","ESP","FRA","BEL","LUX","CHE","ITA","SVN","HRV","BIH","SRB","MNE","ALB","MKD","GRC","BGR","ROU","TUR","CYP","SYR","LBN","ISR","PSE","JOR","EGY","LBY","TUN","DZA","MAR","GBR","AUT","HUN"], fly: "keys" },
 { t: "Faiths that travelled", when: "about 500 BC to AD 750",
   body: `<p>Three faiths that began in small places now count billions of followers.</p>
   <ul><li><b>Buddhism</b> began in the Ganges plain with the Buddha (around the 5th century BC) and spread by monks and merchants to Sri Lanka, South-East Asia, China, Korea and Japan.</li>
   <li><b>Christianity</b> began in Roman Judea in the 1st century AD, spread along Roman roads and sea lanes, and became the empire's favoured faith in the 300s. Aksum in Ethiopia adopted it in the 4th century, one of the earliest states to do so.</li>
   <li><b>Islam</b> began in Mecca and Medina with the Prophet Muhammad in the early 600s. Within about a century of his death in 632, Muslim rule stretched from Spain to the Indus. The countries shaded were wholly or partly inside that area by about 750.</li></ul>
   <p><span class="kind">Note</span>Trade routes and faith routes are often the same routes. Islam reached West Africa mainly through Saharan traders and scholars, not conquest.</p>`,

 { t: "Across the Sahara and the Indian Ocean", when: "about AD 800 to 1600",
   body: `<p>Blainey describes the Sahara as a dry sea: dangerous, but crossed for centuries by camel caravans running between "desert ports". Gold, ivory and enslaved people went north; salt, cloth, horses, books and Islam came south. Ghana (Wagadu), then Mali and Songhai grew rich on this trade. In 1324 Mansa Musa of Mali passed through Cairo on pilgrimage with so much gold that he was remembered for it for generations. Timbuktu became a city of scholars.</p>
   <p>Nigeria sat on these routes too: Kanem-Bornu near Lake Chad and the Hausa cities such as Kano traded north across the desert, while the Kingdom of Benin and the Yoruba city of Ife in the south produced bronze and brass sculpture famous across the world.</p>
   <p>On the east coast, Swahili towns such as Kilwa, Zanzibar and Mogadishu traded with Arabia, India and even China, carried by the monsoon winds; Great Zimbabwe, inland, shipped gold through them.</p>`,

 { t: "Polynesia and Madagascar", when: "about 1000 BC to AD 1300",
   body: `<p>The greatest feat of navigation before modern instruments. People of the Lapita culture reached Fiji, Tonga and Samoa about 3,000 years ago. After a long pause, Polynesian voyagers in double-hulled canoes, steering by stars, swells and birds, settled the far corners of the Pacific in a few centuries: Hawaii and Rapa Nui (Easter Island) by about AD 1000–1200, and Aotearoa New Zealand around 1250–1300, the last large habitable land on Earth to be settled.</p>
   <p>The same Austronesian seafaring family sailed west too: Madagascar was settled by people from Borneo, across the Indian Ocean, perhaps 1,500 years ago, joined later by Africans from the mainland. Malagasy is still an Austronesian language.</p>`,

 { t: "The Mongols and the Black Death", when: "1206 to 1350s",
   body: `<p>From the Mongolian steppe, Genghis Khan and his successors built the largest connected land empire in history, from Korea to the edge of central Europe. It was brutal in conquest, but under Mongol rule the Silk Roads became safer for merchants, and goods, ideas and diseases moved faster across Eurasia than ever before.</p>
   <p>Plague is thought to have spread west along those routes. It reached Caffa in Crimea in 1346, then sailed with merchant ships to Constantinople, Sicily, Marseille and beyond. Between 1347 and 1351 the Black Death killed perhaps a third to a half of Europe's people, and struck the Middle East and North Africa hard too.</p>
   <p class="src">The shaded countries were wholly or partly under Mongol rule at the empire's height, around 1260–1280.</p>`,

   keys: ["MNG","CHN","KOR","RUS","KAZ","KGZ","TJK","UZB","TKM","AFG","IRN","IRQ","AZE","ARM","GEO","UKR","PAK","TUR"], fly: "keys" },
 { t: "The oceans joined", when: "1492 to 1522",
   body: `<p>In thirty years, European sailors linked every ocean. <b>Columbus</b> sailed west from Spain in 1492 and reached the Caribbean. <b>Vasco da Gama</b> sailed from Lisbon around the Cape of Good Hope to Calicut in India in 1497–98, opening a sea route to Asia that avoided the Middle East. The expedition of <b>Magellan</b>, completed by Elcano after Magellan was killed in the Philippines, sailed around the world in 1519–22.</p>
   <p><span class="kind">Interpretation</span>Blainey's view is that the world "shrank" from this point: what happened in one continent began to shape the others. Historians of Asia add that Europeans entered trading networks in the Indian Ocean that were already old, rich and busy, and for a long time were minor players in them.</p>`,

   fly: "world" },
 { t: "The great exchange, and the Atlantic slave trade", when: "1500 to 1866",
   body: `<p>After 1492, plants, animals and diseases crossed the Atlantic in both directions: historians call it the Columbian exchange. From the Americas came <b>maize, cassava, groundnuts, sweet potatoes, tomatoes, chilli peppers and cocoa</b>, which became staples across Africa and Asia; cassava (garri, fufu) and maize are now central to Nigerian food. To the Americas went wheat, sugar cane, rice, horses and cattle, and diseases such as smallpox and measles that killed a large share of the Indigenous population.</p>
   <p>Plantations of sugar, tobacco and later cotton were worked by enslaved Africans. The SlaveVoyages database estimates that about <b>12.5 million</b> Africans were forced onto ships between 1501 and 1866, and about 10.7 million survived the crossing. The largest source region was West-Central Africa (Congo and Angola); the <b>Bight of Benin</b> and the <b>Bight of Biafra</b>, the coasts of today's Benin and Nigeria, were next. Brazil received the most, nearly five million.</p>
   <div class="note"><span class="kind">Read critically</span>Blainey stresses that slavery existed in many societies and that African rulers and traders sold captives. Both are true, but scale and system matter: the Atlantic trade was an industrial, racialised, centuries-long business whose effects on population, trust and politics are still measured today (see the debate below).</div>`,
   pins: [pin("Bight of Biafra", [6.5, 4.0]), pin("Ouidah", [2.08, 6.36]), pin("Luanda", [13.23, -8.84]), pin("Salvador da Bahia", [-38.5, -12.97]), pin("Jamaica", [-76.8, 18.0]), pin("Rio de Janeiro", [-43.2, -22.9])],
   routes: [line([6.5, 4.0], [-38.5, -12.97]), line([2.08, 6.36], [-30, 12], [-76.8, 18.0]), line([13.23, -8.84], [-43.2, -22.9])], fly: "pins" },
 { t: "Steam shrinks the world", when: "1760s to 1914",
   body: `<p>Coal-fired steam engines, improved by James Watt from the 1760s, powered factories first in Britain, then railways (the first public steam railway opened in 1825) and steamships. The telegraph sent messages across the Atlantic by cable from 1866. The Suez Canal, opened in 1869, cut the sea route from Britain to India dramatically: <b id="suezcut"></b></p>
   <p>Steam, rifles and quinine also made it possible for European powers to conquer the interior of Africa, which earlier disease and distance had protected. That story continues in <b>History through maps</b> (1880 and 1914) and in <b>How borders are made</b>.</p>`,
   pins: [pin("Manchester", [-2.24, 53.48]), pin("Suez", [32.35, 30.6]), pin("Mumbai", [72.88, 19.08])],

const routeKm = pts => pts.slice(1).reduce((s, p, i) => s + km(pts[i], p), 0);
function storyStop(i, quiet) {
  const s = STORY[i]; clearMap();
  if (s.depth || S.depthByStory) { $("#L-depth").checked = !!s.depth; S.depthByStory = !!s.depth; applyLayers(); render(); }
  if (s.depth) legend([["--sea", "Shelf, under 200 m: partly dry in the Ice Age"], ["--d1", "200–3,000 m"]]);
  if (s.keys) colorGroups([[s.keys, "var(--c-af)"]], {fly: false});
  setRoutes(s.routes || []); setPins(s.pins || []);
  const pts = (s.pins || []).map(p => p.c);
  if (s.fly === "world") resetView();
  else if (s.fly === "keys") flyToKeys(s.keys.map(k3).filter(Boolean), {pad: .9, maxk: 4});
  else if (pts.length) flyTo({type: "MultiPoint", coordinates: pts}, {pad: .75, maxk: 6});
  $("#storyinfo").innerHTML = `<div class="eyebrow">Stop ${i + 1} of ${STORY.length}: ${esc(s.when)}</div><h3 style="margin-top:2px">${esc(s.t)}</h3>${s.body}
    <div class="btnrow"><button class="btn" data-act="story" data-i="${i - 1}" ${i ? "" : "disabled"}><svg class="bk" aria-hidden="true"><use href="#i-back"/></svg>Back</button>${i + 1 < STORY.length ? `<button class="btn primary" data-act="story" data-i="${i + 1}">Next: ${esc(STORY[i + 1].t)}</button>` : `<button class="btn primary" data-act="africaDebate">Debate: why did Africa's story unfold this way?</button>`}</div>`;
  if ($("#suezcut")) { const cape = STORY[STORY.length - 1].routes[0].geo.coordinates, suez = STORY[STORY.length - 1].routes[1].geo.coordinates;
    $("#suezcut").textContent = `on the routes drawn here, from about ${fmt(Math.round(routeKm(cape) / 100) * 100)} km around Africa to about ${fmt(Math.round(routeKm(suez) / 100) * 100)} km through Suez.`; }
  document.querySelectorAll("#storychips .chip").forEach((c, j) => c.classList.toggle("on", j === i));
  saved.storyAt = i; store.set(saved);
  if (!quiet) $("#storyinfo").scrollIntoView({block: "start", behavior: "smooth"}); }

ACT.africaDebate = () => {
  $("#storyinfo").innerHTML = `<div class="eyebrow">Debate</div><h3 style="margin-top:2px">Why did Africa's history unfold the way it did?</h3>
  <h4>Facts first</h4>
  <p>Africa is where humans began, and it had cities, states and long-distance trade for thousands of years: Egypt, Kush, Aksum, Ghana, Mali, Songhai, Kanem-Bornu, Great Zimbabwe, Kilwa, Benin, Oyo and Sokoto among them. Its great rivers, apart from the Nile, are broken by falls and rapids close to the sea, and its coastline has few deep bays. After 1500 it lost millions of people to the Atlantic, Saharan and Indian Ocean slave trades, and after 1880 almost all of it was conquered by European powers.</p>
  <div class="btnrow"><button class="btn" data-act="barriers">Show the barriers</button><button class="btn" data-act="axes">Show the continental axes</button></div>
  <h4>Three ways of explaining it</h4>
  <p><b>1. Geography.</b> Blainey argues the Sahara, waterfalls on the rivers, a smooth coastline (he estimates only about 2% of Africa is peninsula or island, against about a third of Europe) and the tsetse fly, which kills cattle and horses across much of the tropics, kept Africa's interior apart from the trade and ideas of Eurasia. Jared Diamond (<i>Guns, Germs, and Steel</i>, 1997) adds that Eurasia runs east–west, so crops and animals spread along one band of climate, while Africa and the Americas run north–south across many climates.</p>
  <p><b>2. Extraction and institutions.</b> Walter Rodney (<i>How Europe Underdeveloped Africa</i>, 1972) puts the weight on what was done to Africa: the slave trades and colonial rule drained people and wealth. Economists have since measured this. Nathan Nunn (2008) found that the parts of Africa that lost the most people to the slave trades are poorer today; Nunn and Wantchekon (2011) found lower trust in communities whose ancestors were most heavily raided. Acemoglu and Robinson argue that colonies built to extract left extractive institutions behind.</p>
  <p><b>3. Connection, not isolation.</b> Many historians of Africa reject the picture of a cut-off continent. Saharan caravans, Nile boats and Indian Ocean monsoons tied Africa to the wider world; Malian gold mattered to Mediterranean money, and Swahili ports traded as far as China.</p>
  <h4>Testing the explanations</h4>
  <p>Geography explains constraints, not outcomes: the same desert and rivers that "isolated" Africa also carried the trade that built Mali and Kanem-Bornu. The extraction view explains a lot after 1500 but less about differences between African societies before it. A fair conclusion is that geography set the board, and trade, power and violence decided much of the game. Which weighting you choose depends on how much you think places shape people, or people shape places.</p>
  <div class="btnrow"><button class="btn" data-act="story" data-i="0">Back to the first stop</button><button class="btn primary" data-mode-go="history">Next lesson: History through maps</button></div>`;
  $("#storyinfo").scrollIntoView({block: "start", behavior: "smooth"}); };

  <div id="storyinfo" class="card"></div>
  ${SRC_BOOKS}`);
  storyStop(Math.min(saved.storyAt || 0, STORY.length - 1), true); };

MODES.politics = () => { clearMap(); resetView();
  const max = UN_GROWTH[UN_GROWTH.length - 1][1];
  setPanel(`<div class="eyebrow">International relations</div><h2>World politics on the map</h2>
  <p>The previous lessons asked <i>where</i> things are. This one asks how states deal with each other: who has power, who joins whom, and why. Each button colours the map.</p>

  <h3>1. A world of sovereign states</h3>
  <p>The map of neat coloured countries is a modern idea. The Peace of Westphalia (1648) is the usual symbol of a system in which each state rules its own territory and no higher authority rules over states. That system spread from Europe across the world, largely through empire and then decolonisation.</p>
  <p>When the United Nations was founded in 1945 it had 51 members. Africa had only four: Egypt, Ethiopia, Liberia and South Africa. Decolonisation nearly doubled the number by 1960:</p>
  <div>${UN_GROWTH.map(([y, n]) => `<div class="bar"><span>${y}</span><span class="track"><i style="width:${n / max * 100}%"></i></span><span class="n">${n}</span></div>`).join("")}</div>
  <div class="btnrow"><button class="btn primary" data-act="pol" data-v="founders">Show the 1945 founders</button></div>
  <p class="src">China's seat was held by the Republic of China (Taiwan) until 1971. The USSR, Czechoslovakia and Yugoslavia are shown with their main successor states.</p>

  <h3>2. What makes a state powerful</h3>
  <p>Textbooks list the elements of national power: geography (size, location, terrain, access to the sea), population, natural resources, economic strength, military force, and harder-to-measure things such as leadership, diplomacy and national morale. None works alone: a large population is a strength only if it is healthy, educated and employed; oil is power only if it can be shipped.</p>
  <div class="btnrow"><button class="btn" data-act="pol" data-v="pop">Map population</button></div>
  <p class="src"><span class="src"><button class="chip" data-ind="pop">About these figures</button></span> ${Object.values(D.facts).filter(f => f.pop > 2e8).length} countries are above 200 million: ${Object.values(D.facts).filter(f => f.pop > 2e8).sort((a, b) => b.pop - a.pop).map(f => esc(f.n)).join(", ")}.</p>
  <p>Population totals say little on their own; age says more. A country with a median age near 18, like Nigeria, has a huge generation entering work every year: a "demographic dividend" if there are jobs and schools, a source of unrest and emigration if there are not. Countries with a median age above 45, like Japan or Italy, face shrinking workforces and heavy pension bills. The two maps below show how this will change by 2050.</p>
  <div class="btnrow"><button class="btn" data-act="pol" data-v="age">Map median age</button><button class="btn" data-act="pol" data-v="growth">Map change, 2026 to 2050</button></div>
  <p id="demonote" class="src"></p>

  <h3>3. Geopolitics: theories drawn on maps</h3>
  <p><b>Mahan</b> (1890) argued that sea power, navies and bases at chokepoints made Britain great. <b>Mackinder</b> (1904, 1919) answered that railways would let a land power in the Eurasian "Heartland" dominate: "Who rules the Heartland commands the World-Island." <b>Spykman</b> (1942–44) replied that the real prize was the "Rimland", the populous coastal crescent around it, which became the logic of US alliances in the Cold War.</p>
  <div class="btnrow"><button class="btn" data-act="pol" data-v="heart">Show Heartland and Rimland</button><button class="btn" data-mode-go="geo">Mahan's chokepoints</button></div>
  <p><span class="kind">Read critically</span>These are theories, not laws. In Germany, Karl Haushofer bent such ideas into the Nazi claim to <i>Lebensraum</i> ("living space"). Geography constrains states; it does not decide what they do.</p>

  <h3>4. Balance of power, alliances and buffers</h3>
  <p>Realists see states as balancing against whoever becomes too strong: forming alliances and counter-alliances, arming, or keeping weak <b>buffer states</b> between rivals. Afghanistan's thin Wakhan Corridor was drawn in the 1890s so that the Russian Empire and British India would not touch. Mongolia sits between Russia and China; Nepal and Bhutan between China and India.</p>
  <div class="btnrow"><button class="btn" data-act="pol" data-v="buffers">Show buffer states</button><button class="btn" data-act="pol" data-v="cold">Show the Cold War blocs</button></div>
  <p>The Cold War (about 1947–1991) was a balance between two blocs led by the United States and the Soviet Union, held in check by nuclear deterrence. It ended with the fall of the Berlin Wall (1989) and the break-up of the Soviet Union into 15 states (1991).</p>

  <h3>5. Non-alignment and the Global South</h3>
  <p>Newly independent states refused to be pawns of either bloc. The Asian–African Conference at Bandung, Indonesia (1955) brought 29 countries together; the first Non-Aligned Movement summit met in Belgrade in 1961 with 25 members, led by Nehru (India), Nasser (Egypt), Tito (Yugoslavia), Sukarno (Indonesia) and Nkrumah (Ghana). NAM now has about 120 members, Nigeria among them.</p>
  <div class="btnrow"><button class="btn" data-act="pol" data-v="nam">Show NAM's founders</button></div>

  <h3>6. Today's clubs and alliances</h3>
  <p>Tap a group to colour its members. Overlaps are the point: Nigeria is in the AU, ECOWAS, OPEC, the Commonwealth and NAM, and is a BRICS partner.</p>
  <div class="chips" id="blocchips">${Object.entries(BLOC9).map(([k, b]) => `<button class="chip" data-act="bloc9" data-b="${k}">${esc(b.n)}</button>`).join("")}</div>
  <div id="blocinfo9" class="note">Choose a group.</div>
  <p class="src">Memberships checked in October 2026. Groups admit, suspend and lose members, so check the latest before relying on a list.</p>

  <h3>7. Four lenses on the same map</h3>
  <p>International Relations has competing theories. Each makes some maps look important and others irrelevant.</p>
  <ul><li><b>Realism</b> (Carr, Morgenthau, Waltz): states seek power and security in a world with no government above them. Look at nuclear weapons and the veto. <button class="chip" data-act="bloc9" data-b="NUKE">Nuclear map</button></li>
  <li><b>Liberalism</b>: trade, institutions and democracy make cooperation pay. Look at the EU and the AU. <button class="chip" data-act="bloc9" data-b="EU">EU map</button></li>
  <li><b>Marxist and world-systems theory</b> (Wallerstein): a wealthy "core" draws profit from a poorer "periphery". Look at income. <button class="chip" data-act="pol" data-v="income">Income map</button></li>
  <li><b>Constructivism</b> (Wendt): interests come from ideas and identities, so "anarchy is what states make of it". Look at self-chosen groups like NAM and BRICS, which share identity more than rules.</li></ul>
  <p><span class="kind">Interpretation</span>None of the lenses is complete. Realism predicts the Security Council's deadlock well and the EU's existence badly; world-systems theory explains Nigeria's dependence on crude exports, but not South Korea's rise from the periphery. Using more than one is the habit to build.</p>

 { t: "Before Nigeria", when: "about 9000 BCE to 1500 CE", map: null,

 { t: "1914: one colony from many peoples", when: "1914 to 1929", map: 1914,
   body: `<p>The name "Nigeria" was suggested in 1897 by the journalist Flora Shaw, later Lugard's wife. On <b>1 January 1914</b> Lugard joined the Northern and Southern Protectorates into one colony, mainly for administrative and financial convenience: the coastal south's customs revenue could pay for the poorer north.</p>

   <p>On 27 May 1967 Gowon replaced the four regions with <b>twelve states</b>. Three days later, on <b>30 May 1967</b>, Odumegwu Ojukwu declared the Eastern Region the <b>Republic of Biafra</b>. The war lasted until January 1970. Estimates of the dead range from about half a million to more than two million, most of them from starvation under blockade.</p>

ACT.ngdebate = () => { ngMap(1996); setPins([]);
  $("#ngstoryinfo").innerHTML = `<div class="eyebrow">Debate</div><h3 style="margin-top:2px">The national question: is Nigeria a nation, and on what terms?</h3>
  <h4>Facts first</h4>
  <p>Nigeria's borders were drawn by Britain and joined in 1914. It contains more than 250 ethnic groups and over 500 languages; the three largest groups are the Hausa-Fulani, Yoruba and Igbo, and none is a majority. The federation has gone from 3 regions to 36 states. Most federal revenue has come from oil produced in the Niger Delta and shared out by formula. Nigeria has held together through a civil war, six successful coups (1966 twice, 1975, 1983, 1985, 1993) and long military rule.</p>
  <h4>Four views</h4>
  <p><b>1. "A mere geographical expression."</b> Obafemi Awolowo wrote in 1947 that Nigeria was not a nation but a geographical expression, and argued for a federation in which each major ethnic group governed itself. Today's calls for "restructuring" and "true federalism" (regional autonomy, state police, resource control) descend from this view.</p>
  <p><b>2. Soyinka: a nation must be earned.</b> In <i>The Open Sore of a Continent</i> (1996) Soyinka points out that no nation is natural: the Kurds, Catalonia and the Soviet Union show that nationhood is always made and remade by conflict, interest and accident. So a colonial origin is not the real problem. What decides whether Nigeria is a nation is whether it serves the people inside it. A state that annuls their vote (June 12) and kills its critics (the Ogoni Nine) has no claim to loyalty based on "territorial integrity" alone; until it becomes, in his words, a "humanized space", Nigeria is a duty, not yet a nation.</p>
  <p><b>3. Falola and Heaton: a colonial creation that became real.</b> The historians accept that Britain made the frame, but show a century of shared institutions, markets, migration, schools, music and intermarriage inside it. Nigeria's crises, in their account, come less from the existence of the country than from colonial structures, military rule, oil dependence and corruption.</p>
  <p><b>4. Achebe: leadership.</b> Chinua Achebe argued in <i>The Trouble with Nigeria</i> (1983) that the trouble is simply a failure of leadership, not the land, the climate or the people. On this view, restructuring without better leaders would change little.</p>
  <h4>Testing the views</h4>
  <p>The "artificial borders" argument proves less than it seems: Italy, Germany and Indonesia were also assembled recently, and Tanzania joined Tanganyika and Zanzibar by agreement in 1964. Yet the civil war and the Biafra and Ambazonia movements show that a state can hold territory by force without holding consent. Soyinka's test (does the state serve its people?) and Achebe's (who leads?) both move the question from maps to institutions. The 2014 National Conference under President Jonathan produced hundreds of recommendations; few have been put into practice. Which view you find strongest depends on whether you think the problem is the design of the federation, the conduct of those who run it, or both.</p>
  <div class="btnrow"><button class="btn" data-act="ngstop" data-i="0">Back to the start</button><button class="btn primary" data-mode-go="story">Next lesson: The human story on the map</button></div>`;
  $("#ngstoryinfo").scrollIntoView({block: "start", behavior: "smooth"}); };

const NGFP_HTML = () => `<h3>8. Nigeria in the world</h3>
  <p>Nigerian IR courses spend a lot of time here, so this section sets out the main ideas and events in order.</p>
  <p><b>Africa as the centrepiece.</b> From independence, and explicitly from the 1970s, Nigerian governments have described Africa as the "centrepiece" of their foreign policy. In the 1980s the scholar-diplomat Ibrahim Gambari described this as <b>concentric circles</b>: Nigeria's own security and its immediate neighbours first, then West Africa, then Africa, then the wider world.</p>
  <div class="btnrow"><button class="btn" data-act="ngfp" data-v="circles">Show the concentric circles</button></div>
  <p><b>Against colonialism and apartheid.</b> Nigeria was far from southern Africa but acted almost as a "frontline state": Murtala Mohammed's government recognised the MPLA government of Angola in 1975, and in 1979 Nigeria nationalised BP's local assets over Britain's dealings with apartheid South Africa and the Rhodesia question.</p>
  <div class="btnrow"><button class="btn" data-act="ngfp" data-v="liberation">Show the liberation struggles</button></div>
  <p><b>Regional leadership.</b> Nigeria led the founding of ECOWAS in Lagos in 1975. Through ECOWAS's monitoring force, <b>ECOMOG</b>, it led interventions in Liberia (from 1990) and Sierra Leone (1997–98), paying most of the cost in money and soldiers. Nigerian troops have served in UN peacekeeping since the Congo in 1960. The Technical Aid Corps (1987) sends Nigerian professionals to other African, Caribbean and Pacific countries.</p>
  <div class="btnrow"><button class="btn" data-act="ngfp" data-v="ecomog">Show ECOMOG's main missions</button></div>
  <p><b>Law over force: Bakassi.</b> When the International Court of Justice awarded the Bakassi Peninsula to Cameroon in 2002, Nigeria, after the Greentree Agreement (2006), handed it over in 2008 rather than fight. Critics at home called it a surrender; supporters call it Nigeria's clearest act of respect for international law.</p>
  <div class="btnrow"><button class="btn" data-act="ngfp" data-v="bakassi">Fly to Bakassi</button></div>
  <p><b>Doctrines since 1999.</b> "Citizen diplomacy" (from 2007) said foreign policy should serve Nigerians abroad. Since 2023 the "4-D" approach stresses <b>democracy, development, demography and diaspora</b>. Recent tests: the 2023 coup in Niger and the exit of the Sahel juntas from ECOWAS, Nigeria becoming a BRICS partner (2025), US pressure and military cooperation over insecurity (2025–26), and recurring xenophobic attacks on Nigerians in South Africa.</p>
  <p><span class="kind">Interpretation</span>A realist reads Nigeria's Africa-first policy as a regional power securing its neighbourhood; a liberal reads ECOWAS and Bakassi as institution-building; a critic notes that Nigeria often spent heavily abroad (ECOMOG) while its own citizens lacked basic services. Exam answers that weigh these readings score better than lists of events.</p>`;

  <p>Every country page now has a "Money and economy" section. This lesson explains what those numbers mean, why currencies cross borders, and why the same economy can look rich or poor depending on how you measure it.</p>

  <h3>1. What a currency is</h3>
  <p>A currency is a promise that people will accept it in payment, backed by a state and managed by a central bank (the Central Bank of Nigeria for the naira). Its value against other currencies, the <b>exchange rate</b>, can <b>float</b> with supply and demand, be <b>pegged</b> at a fixed rate to another currency, or be <b>managed</b> in between. A country can also give up its own currency and use someone else's.</p>
  <p><b>The trade-off:</b> a floating currency absorbs shocks (when oil prices fall, the naira falls, and exports become cheaper) but makes import prices and inflation jump. A peg brings stability and low inflation but removes a tool: the country cannot devalue or set its own interest rates.</p>

  <h3>2. Currencies shared across borders</h3>
  <div class="btnrow"><button class="btn primary" data-act="money" data-v="unions">Map the currency unions</button></div>
  <ul><li><b>The euro</b>: 21 EU countries share one currency and one central bank (the ECB, in Frankfurt). Bulgaria joined on 1 January 2026.</li>
  <li><b>The CFA francs</b>: two currencies used by 14 African countries, mostly former French colonies: the West African CFA franc (8 WAEMU states, including Nigeria's neighbours Benin and Niger) and the Central African CFA franc (6 CEMAC states, including Cameroon and Chad). Both are pegged at 655.957 francs to the euro, and France guarantees convertibility.</li>
  <li><b>The rand area</b>: Lesotho, Eswatini and Namibia peg their currencies to the South African rand, which also circulates there.</li>
  <li><b>Dollarised countries</b> such as Ecuador, El Salvador, Panama and Timor-Leste use the US dollar outright. Zimbabwe launched a new gold-backed currency, the ZiG, in 2024, but the dollar still dominates daily trade, and in 2026 the central bank dropped its target date for making the ZiG the only currency: a lesson in how hard it is to rebuild trust in money.</li></ul>

  <h3>3. The CFA franc debate</h3>

  <p><b>Facts.</b> The CFA franc was created in 1945. In 2019 France and the WAEMU states agreed reforms: the West African central bank no longer has to keep half its reserves in the French Treasury, and French officials left its boards. The peg to the euro and the French guarantee remain. The planned renaming of the West African CFA franc to "Eco" has not yet happened. Central Africa has not reformed its CFA in the same way.</p>
  <p><b>The case for it:</b> the CFA zones have had much lower inflation than most of their neighbours, including Nigeria and Ghana, and a stable currency helps saving and trade.</p>

  <h3>5. The naira</h3>
  <p>The naira replaced the Nigerian pound on 1 January 1973, at two naira to the pound. For years the government held it at an official rate far above its market value, rationing dollars and creating a gap with the "black market". The Structural Adjustment Programme of 1986 began a long series of devaluations.</p>

  <h3>6. Size versus living standards</h3>

  <p><b>The exchange-rate trap.</b> Nigeria's 2025 rebasing raised its 2024 GDP by about 34% in naira, to ₦372.8 trillion, mainly by counting sectors such as services and real estate better. Yet in dollars it is about US$243 billion, far below the US$448 billion of 2019, because the naira lost most of its dollar value. The country did not produce less; the measuring stick shrank. That is why economists also use <b>purchasing power parity (PPP)</b>, which compares what money actually buys at home.${ival("gdp_usd_25", "NGA") != null ? ` The IMF's figure for 2025 is ${esc(itxt("gdp_usd_25", "NGA"))}, or ${esc(itxt("gdp_pc_25", "NGA"))} a person: <button class="lnk" data-act="ngtile" data-id="gdp_pc_25">compare it</button>.` : ""}</p>

  <h3>7. What an economy sells</h3>
  <p>After the rebasing, services make up 55.5% of Nigeria's GDP, agriculture 27.8% and industry 16.7%, and real estate now contributes more than oil and gas. But oil still earns most of Nigeria's export income and much of government revenue. Nigeria produced ${itxt("oil_out", "NGA")} in 2025, ${itxt("oil_share", "NGA")} of the world's output, far behind the United States (${itxt("oil_share", "USA")}), Saudi Arabia (${itxt("oil_share", "SAU")}) and Russia (${itxt("oil_share", "RUS")}). That combination, a big domestic economy but foreign currency from one commodity, is why oil prices move the naira, the budget and inflation all at once.</p>

/* phone: drag or tap the handle to share the screen between map and reading */
(() => { const g = $("#grip"); let y0 = null, h0 = 0, moved = 0;
  const setH = px => { const vh = window.innerHeight, cl = Math.max(vh * .2, Math.min(vh * .76, px)); document.documentElement.style.setProperty("--mh", cl + "px"); };
  const done = () => setTimeout(() => refit(true), 280);
  g.addEventListener("pointerdown", e => { y0 = e.clientY; h0 = $("#mapwrap").getBoundingClientRect().height; moved = 0; g.setPointerCapture(e.pointerId); $("#main").style.transition = "none"; });
  g.addEventListener("pointermove", e => { if (y0 == null) return; moved = Math.max(moved, Math.abs(e.clientY - y0)); if (moved > 4) setH(h0 + e.clientY - y0); });
  g.addEventListener("pointerup", () => { $("#main").style.transition = ""; if (y0 == null) return; y0 = null;
    if (moved <= 4) { const big = h0 > window.innerHeight * .5; setH(window.innerHeight * (big ? .3 : .66)); } done(); }); })();

/* installable on GitHub Pages: works offline after the first visit */

  try { const l = document.createElement("link"); l.rel = "manifest"; l.href = "manifest.webmanifest"; document.head.appendChild(l);
    const a = document.createElement("link"); a.rel = "apple-touch-icon"; a.href = "icon-192.png"; document.head.appendChild(a);
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {} }

/* ---------- boot ---------- */
async function boot() {
  sizeMap(); projection = makeProjection("equal"); path = d3.geoPath(projection);
  try {
    // data is embedded in the page (no network requests); fall back to the published files if a block is missing
    const get = n => { const el = document.getElementById("d-" + n); return el ? Promise.resolve(JSON.parse(el.textContent)) : fetch(`data/${n}.json`).then(r => { if (!r.ok) throw new Error(n); return r.json(); }); };
    const [world, facts, phys, cities, ng] = await Promise.all(["world", "facts", "physical", "cities", "nigeria"].map(get));
    D = {world, facts, phys, cities, ng};
    try { D.hist = await get("hist"); } catch (e) { D.hist = null; }
    try { D.wpp = await get("wpp"); } catch (e) { D.wpp = null; }
    try { D.econ = await get("econ"); } catch (e) { D.econ = null; }
    try { D.now = await get("now"); } catch (e) { D.now = null; }
    try { D.pl = await get("pipeline"); } catch (e) { D.pl = null; }
  } catch (e) { $("#loading").textContent = "The map data did not load. Reload the page to try again."; return; }
  Object.entries(D.facts).forEach(([k, f]) => { byKey.set(k, f); byC3.set(f.c3, k); }); applyWPP(); plApply();
  buildMap(); render(); $("#loading").hidden = true; IDX = searchIndex();
  lastSize = [$("#mapwrap").getBoundingClientRect().width, $("#mapwrap").getBoundingClientRect().height];
  routeHash(true);
  if (!saved.welcomed) showWelcome(); }

  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); resIdx = Math.max(0, Math.min(btns.length - 1, resIdx + (e.key === "ArrowDown" ? 1 : -1))); btns.forEach((b, i) => b.classList.toggle("on", i === resIdx)); }
  else if (e.key === "Enter") { e.preventDefault(); pickResult(resIdx < 0 ? 0 : resIdx); } else if (e.key === "Escape") $("#results").hidden = true; });
$("#results").addEventListener("click", e => { const b = e.target.closest("button"); if (b) pickResult(+b.dataset.i); });
document.addEventListener("click", e => { if (!e.target.closest(".search")) $("#results").hidden = true; }, true);

let rz, lastSize = [0, 0]; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(refit, 200); });
var refit = function (force) { if (force) lastSize = [0, 0]; const r = $("#mapwrap").getBoundingClientRect();
  if (Math.abs(r.width - lastSize[0]) < 2 && Math.abs(r.height - lastSize[1]) < 90) return; // phone URL bar showing/hiding: keep the view
  lastSize = [r.width, r.height]; const keep = S.proj; sizeMap(); setProjection(keep); paint(); if (S.sel && featByKey.has(S.sel)) flyTo(featByKey.get(S.sel), {duration: 0}); }
boot();
